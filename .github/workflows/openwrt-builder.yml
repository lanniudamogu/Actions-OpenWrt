name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6

  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh

  TZ: Asia/Shanghai

  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true

  # ===== ccache =====
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  USE_CCACHE: 1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    # =========================
    # system setup
    # =========================
    - name: Init system
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache

        sudo timedatectl set-timezone "$TZ"

    # =========================
    # cache dl + ccache
    # =========================
    - name: Cache dl
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-

    # =========================
    # clone source
    # =========================
    - name: Clone source
      run: |
        mkdir -p /workdir
        cd /workdir

        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # =========================
    # feeds
    # =========================
    - name: Feeds
      run: |
        cd openwrt

        [ -e ../$FEEDS_CONF ] && cp ../$FEEDS_CONF feeds.conf.default

        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # =========================
    # config
    # =========================
    - name: Config
      run: |
        cd openwrt

        [ -e ../files ] && cp -r ../files files
        [ -e ../$CONFIG_FILE ] && cp ../$CONFIG_FILE .config

        ../$DIY_P1_SH || true
        ../$DIY_P2_SH || true

    # =========================
    # download
    # =========================
    - name: Download
      run: |
        cd openwrt
        make defconfig
        make download -j8

    # =========================
    # build
    # =========================
    - name: Compile
      run: |
        cd openwrt

        export PATH="/usr/lib/ccache:$PATH"
        export CCACHE_DIR=${{ github.workspace }}/.ccache

        make -j$(nproc) || make -j1 V=s

        echo "status=success" >> $GITHUB_OUTPUT

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
        | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true

        echo "DEVICE_NAME=_$(cat DEVICE_NAME 2>/dev/null || echo unknown)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # =========================
    # artifact
    # =========================
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: OpenWrt${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    # =========================
    # release
    # =========================
    - name: Create tag
      if: env.UPLOAD_RELEASE == 'true'
      run: |
        echo "release_tag=${{ env.DEVICE_NAME }}-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Upload Release
      if: env.UPLOAD_RELEASE == 'true'
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.create_tag.outputs.release_tag }}
        files: openwrt/bin/targets/*/*/*
