name: OpenWrt Multi-Device Builder (Stable)

on:
  workflow_dispatch:
  repository_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6

  TZ: Asia/Shanghai

  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true


jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - device: cudy_tr3000
            config: configs/cudy_tr3000-v1-ubootmod.config

          #- device: GL_MT6000
            config: configs/mt6000.config

          #- device: x86_64
            config: configs/x86_64.config


    name: Build-${{ matrix.device }}


    steps:

    # =========================
    # Checkout
    # =========================
    - name: Checkout
      uses: actions/checkout@v4


    # =========================
    # Dependencies
    # =========================
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git gawk gettext \
          libncurses5-dev libssl-dev \
          python3 rsync unzip wget


    # =========================
    # Clone OpenWrt
    # =========================
    - name: Clone source
      run: |
        mkdir -p /workdir
        cd /workdir

        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -s /workdir/openwrt $GITHUB_WORKSPACE/openwrt


    # =========================
    # Feeds
    # =========================
    - name: Update feeds
      run: |
        cd /workdir/openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a


    # =========================
    # Config per device
    # =========================
    - name: Load config
      run: |
        cp ${{ matrix.config }} /workdir/openwrt/.config

        if [ -d files ]; then
          cp -r files /workdir/openwrt/
        fi


    # =========================
    # Defconfig
    # =========================
    - name: Defconfig
      run: |
        cd /workdir/openwrt
        make defconfig


    # =========================
    # DIY scripts
    # =========================
    - name: Run DIY scripts
      run: |
        cd /workdir/openwrt

        if [ -f "$GITHUB_WORKSPACE/diy-part1.sh" ]; then
          chmod +x $GITHUB_WORKSPACE/diy-part1.sh
          $GITHUB_WORKSPACE/diy-part1.sh
        fi

        if [ -f "$GITHUB_WORKSPACE/diy-part2.sh" ]; then
          chmod +x $GITHUB_WORKSPACE/diy-part2.sh
          $GITHUB_WORKSPACE/diy-part2.sh
        fi


    # =========================
    # Download packages
    # =========================
    - name: Download packages
      run: |
        cd /workdir/openwrt
        make download -j8
        find dl -size -1024c -delete


    # =========================
    # Compile
    # =========================
    - name: Compile firmware
      id: compile
      run: |
        cd /workdir/openwrt

        make -j$(nproc) || make -j1 V=s

        echo "status=success" >> $GITHUB_OUTPUT

        echo "DEVICE=${{ matrix.device }}" >> $GITHUB_ENV
        echo "DATE=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV


    # =========================
    # Artifact
    # =========================
    - name: Upload artifact
      if: env.UPLOAD_FIRMWARE == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.device }}
        path: /workdir/openwrt/bin


    # =========================
    # Prepare release
    # =========================
    - name: Prepare release files
      if: env.UPLOAD_RELEASE == 'true'
      run: |
        cd /workdir/openwrt/bin/targets/*/*

        rm -rf packages

        echo "FIRMWARE=$PWD" >> $GITHUB_ENV


    # =========================
    # Release (stable)
    # =========================
    - name: Create release
      if: env.UPLOAD_RELEASE == 'true'
      uses: softprops/action-gh-release@v2.2.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ matrix.device }}-${{ env.DATE }}
        name: OpenWrt-${{ matrix.device }}
        body: |
          OpenWrt build for ${{ matrix.device }}
        files: ${{ env.FIRMWARE }}/*


    # =========================
    # Cleanup releases (NO deprecated action)
    # =========================
    - name: Cleanup old releases
      if: env.UPLOAD_RELEASE == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const releases = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          const keep = 3;

          for (let i = keep; i < releases.data.length; i++) {
            try {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releases.data[i].id,
              });
            } catch (e) {}
          }
